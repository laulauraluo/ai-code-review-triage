name: Review PRs with Looks Good to AI

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/review.yml # this repo tests its own copy; other repos call it @main
    secrets: inherit
